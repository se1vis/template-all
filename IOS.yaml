# 全局配置 (适配 iOS Clash-Client)
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: false
bind-address: "127.0.0.1"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"
    - "+.push.apple.com"
    - "+.tailscale.com"
    - "+.ts.net"

# 入站 (iOS NetworkExtension TUN)
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  # 注意：因为我们在 Mihomo 内置了 Tailscale 出站节点，切勿在 route-exclude-address 中排除 100.64.0.0/10，
  # 否则 iOS 系统不会将 Tailscale 流量送入 TUN，导致无法通过内置的 tailscale 节点访问内网！
  # route-exclude-address:
  #   - 192.168.100.0/24

# DNS模块
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    # Tailscale 域名排除 fake-ip，确保返回真实的 100.x.x.x 内网 IP
    - "+.tailscale.com"
    - "+.ts.net"
    - "+.tailscale.io"
  
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 仅解析机场节点的域名，保证启动和恢复连接稳定
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 默认给非中国域名；# 后接你的代理策略组名
  nameserver:
    - https://1.1.1.1/dns-query#自动选择
    - https://dns.google/dns-query#自动选择

  nameserver-policy:
    # 将 MagicDNS (*.ts.net) 交由内置的 tailscale 节点解析
    "+.ts.net": "ts://tailscale"
    "rule-set:cn_domain,private_domain":
      - 223.5.5.5
      - 119.29.29.29
    "+.cn":
      - 223.5.5.5
      - 119.29.29.29
    "+.lan":
      - 223.5.5.5
      - 119.29.29.29
    "+.local":
      - 223.5.5.5
      - 119.29.29.29

# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
# 节点信息
proxies:
  - name: 直连
    type: direct
  # Tailscale 节点 - 让 iOS 端 Clash-Client 内核直接加入 Tailscale 网络（解决 iOS 单 VPN 限制）
  - name: "tailscale"
    type: tailscale
    # 在 Tailscale 控制台中显示的设备名称
    hostname: "iOS-Clash"
    # 认证密钥：必填！请在 https://login.tailscale.com/admin/settings/keys 生成 Auth Key 填入此处
    auth-key: "tskey-auth-xxxxxxxx"  # <-- 替换为你的真实 Auth Key
    # 状态持久化目录：iOS 端由于沙盒权限限制，必须使用相对路径（不能用 /etc/nikki/...）
    state-dir: "tailscale"
    # 接受 Tailnet 中发布的子网路由（如家里旁路由发布的 192.168.100.0/24）
    accept-routes: true
    # 启用 UDP（DERP/STUN 打洞）
    udp: true
    # 是否为临时节点（关闭后自动从 Tailnet 移除），建议 false
    ephemeral: false
    # 如果使用 Headscale 自建控制服务器，取消注释并填写地址
    # control-url: "https://controlplane.tailscale.com"

proxy-groups:
