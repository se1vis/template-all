    include-all: true
    tolerance: 20
    interval: 300
    filter: "^((?!(直连)).)*$"

  - name: 全部节点
    type: select
    icon: https://raw.githubusercontent.com/se1vis/Koolson-Qure/master/IconSet/brand/Global.png
    include-all: true

  - name: self-auto
    type: url-test
    icon: https://raw.githubusercontent.com/se1vis/Koolson-Qure/master/IconSet/brand/Available.png
    proxies: []
    tolerance: 20
    interval: 300

# 规则匹配
# 此规则部分没有做防泄露处理，因为弊严重大于利！
rules:
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  # Tailscale 直连规则
  - IP-CIDR,100.64.0.0/10,直连,no-resolve
  - DOMAIN-SUFFIX,tailscale.com,直连
  - DOMAIN-SUFFIX,ts.net,直连
  - DOMAIN-SUFFIX,tailscale.io,直连
  - RULE-SET,ai,ChatGPT
  - RULE-SET,github_domain,GitHub
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,apple_domain,直连
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,twitter_domain,Twitter
  - RULE-SET,paypal_domain,PayPal
  - RULE-SET,apple_ip,直连
  - RULE-SET,google_ip,Google
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,geolocation-!cn,默认代理
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连
  - MATCH,漏网之鱼

# 规则集
## type：可选http/file/inline  behavior：可选domain/ipcidr format：可选yaml/mrs
rule-anchor:
  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs
  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs

rule-providers:
  private_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
