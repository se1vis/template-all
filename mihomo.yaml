# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
# interface-name: enp6s18
log-level: warning
find-process-mode: 'off'
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
# 跑裸核朋友自行删除注释即可，使用nikki仅内核的ui路径改为/etc/nikki/run/ui
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: "/etc/mihomo/ui"
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"
    - "+.tailscale.com"
    - "+.ts.net"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #使用仅内核自行修改下面三项为true
  #device: nikki
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
  # Tailscale 网段排除，防止 TUN 劫持产生路由环路
  route-exclude-address:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
    # Tailscale 域名排除 fake-ip
    - "+.tailscale.com"
    - "+.ts.net"
    - "+.tailscale.io"
  
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 仅解析机场节点的域名，保证启动和恢复连接稳定
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 默认给非中国域名；# 后接你的代理策略组名
  nameserver:
    - https://1.1.1.1/dns-query#自动选择
    - https://dns.google/dns-query#自动选择

  nameserver-policy:
    # 兼容旧版 Mihomo：不用 GeoSite.dat 或 rule-set DNS 策略。
    "+.cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.lan":
      - 223.5.5.5
      - 119.29.29.29
    "+.local":
      - 223.5.5.5
      - 119.29.29.29

# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
# 节点信息
proxies:
  - name: 直连
    type: direct
  # Tailscale 节点 - 让 Mihomo 内核直接加入 Tailscale 网络，无需单独安装 Tailscale 插件
  - name: "tailscale"
    type: tailscale
    # 在 Tailscale 控制台中显示的设备名称
    hostname: "iStoreOS-Mihomo"
    # 认证密钥：在 https://login.tailscale.com/admin/settings/keys 生成
    # 首次不填会在 Mihomo 日志中输出登录 URL，手动访问完成认证
    auth-key: ""  # <-- 替换为你的 tskey-auth-xxxxxxxx
    # 状态持久化目录，保存登录凭证防止重启后重新认证
    state-dir: "/etc/nikki/run/tailscale"
    # 接受 Tailnet 中发布的子网路由
    accept-routes: true
    # 启用 UDP（DERP/STUN 打洞）
    udp: true
    # 是否为临时节点（关闭后自动从 Tailnet 移除），建议 false
    ephemeral: false
    # 如果使用 Headscale 自建控制服务器，取消注释并填写地址
    # control-url: "https://controlplane.tailscale.com"

